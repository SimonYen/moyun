[project]
name = "blog"
version = "0.1.0"
description = "Django + djust 博客：LiveView、国风主题、Markdown 编辑、图床与相册"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<6",
    "djust>=1.2.8",
    "granian>=2.8.7",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
